<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline · Cirra</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
         background: #fafafc; color: #1a1a1f; }
  @media (prefers-color-scheme: dark) { body { background: #0d0d10; color: #ececf1; } p { color: #a1a1aa !important; } }
  main { max-width: 360px; padding: 24px; text-align: center; }
  img { width: 56px; height: 56px; }
  h1 { font-size: 20px; margin: 16px 0 6px; }
  p { color: #52525b; margin: 0 0 18px; }
  button { font: inherit; padding: 8px 16px; border-radius: 8px; border: 0; background: #1F6F78; color: #fff; cursor: pointer; }
</style>
</head>
<body>
<main>
  <img src="/icon.svg" alt="">
  <h1>You're offline</h1>
  <p>This page hasn't been opened on this device yet, so there's no saved copy. Pages you've visited recently still open offline.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
