apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "relate.fullname" . }}-files
  labels: {{- include "relate.labels" . | nindent 4 }}
spec:
  accessModes: [{{ .Values.storage.accessMode }}]
  {{- with .Values.storage.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources: { requests: { storage: {{ .Values.storage.size }} } }
