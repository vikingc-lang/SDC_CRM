{{- if not .Values.secrets.existingSecret }}
{{- $name := include "relate.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "relate.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep   # losing these keys would make encrypted data unreadable
type: Opaque
data:
  {{- range $key, $val := dict "JWT_SECRET" .Values.secrets.jwtSecret "DATA_ENCRYPTION_KEY" .Values.secrets.dataEncryptionKey "POSTGRES_PASSWORD" .Values.secrets.postgresPassword }}
  {{- if $val }}
  {{ $key }}: {{ $val | b64enc | quote }}
  {{- else if and $existing (index $existing.data $key) }}
  {{ $key }}: {{ index $existing.data $key | quote }}
  {{- else }}
  {{ $key }}: {{ randAlphaNum 48 | b64enc | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.secrets.erpRestToken }}
  ERP_REST_TOKEN: {{ .Values.secrets.erpRestToken | b64enc | quote }}
  {{- end }}
{{- end }}
