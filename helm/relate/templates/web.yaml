{{- $fn := include "relate.fullname" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fn }}-web
  labels: {{- include "relate.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels: {{- include "relate.selector" (dict "root" . "component" "web") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "relate.selector" (dict "root" . "component" "web") | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: { runAsNonRoot: true, runAsUser: 1001, runAsGroup: 1001 }
      containers:
        - name: web
          image: {{ include "relate.image" (dict "root" . "name" .Values.image.web) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ name: http, containerPort: 3000 }]
          readinessProbe: { httpGet: { path: /login, port: http }, periodSeconds: 10 }
          resources: {{- toYaml .Values.web.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fn }}-web
  labels: {{- include "relate.labels" . | nindent 4 }}
spec:
  selector: {{- include "relate.selector" (dict "root" . "component" "web") | nindent 4 }}
  ports: [{ name: http, port: 3000, targetPort: http }]
