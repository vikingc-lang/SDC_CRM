{{- $fn := include "cirra.fullname" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fn }}-api
  labels: {{- include "cirra.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels: {{- include "cirra.selector" (dict "root" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "cirra.selector" (dict "root" . "component" "api") | nindent 8 }}
      annotations:
        checksum/config: {{ toJson .Values.config | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000 }
      initContainers:
        - name: migrate
          image: {{ include "cirra.image" (dict "root" . "name" .Values.image.api) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["./docker-entrypoint.sh", "true"]
          env:
            {{- include "cirra.backendEnv" . | nindent 12 }}
            - { name: RUN_MIGRATIONS, value: "true" }
            - { name: SEED_DEMO_DATA, value: {{ .Values.seedDemoData | quote }} }
      containers:
        - name: api
          image: {{ include "cirra.image" (dict "root" . "name" .Values.image.api) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
          env:
            {{- include "cirra.backendEnv" . | nindent 12 }}
          ports: [{ name: http, containerPort: 8000 }]
          readinessProbe: { httpGet: { path: /health, port: http }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 20, periodSeconds: 20 }
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts: [{ name: files, mountPath: /data }]
      volumes:
        - name: files
          persistentVolumeClaim: { claimName: {{ $fn }}-files }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fn }}-api
  labels: {{- include "cirra.labels" . | nindent 4 }}
spec:
  selector: {{- include "cirra.selector" (dict "root" . "component" "api") | nindent 4 }}
  ports: [{ name: http, port: 8000, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fn }}-worker
  labels: {{- include "cirra.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  strategy: { type: Recreate }   # a single Celery beat must own the schedule
  selector:
    matchLabels: {{- include "cirra.selector" (dict "root" . "component" "worker") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "cirra.selector" (dict "root" . "component" "worker") | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000 }
      containers:
        - name: worker
          image: {{ include "cirra.image" (dict "root" . "name" .Values.image.api) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["celery", "-A", "app.worker", "worker", "--beat", "--loglevel=info"]
          env:
            {{- include "cirra.backendEnv" . | nindent 12 }}
            - { name: DB_NULL_POOL, value: "true" }
            - { name: RUN_MIGRATIONS, value: "false" }
          resources: {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts: [{ name: files, mountPath: /data }]
      volumes:
        - name: files
          persistentVolumeClaim: { claimName: {{ $fn }}-files }
