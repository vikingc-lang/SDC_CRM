{{- if .Values.networkPolicy.enabled }}
# Zero-egress posture: Cirra pods accept traffic from each other and the ingress controller,
# and can only reach each other plus cluster DNS (and any explicitly allowed CIDRs).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cirra.fullname" . }}-zero-egress
  labels: {{- include "cirra.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }} }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }} } }
        - namespaceSelector: {}
          podSelector: { matchLabels: { app.kubernetes.io/name: ingress-nginx } }
  egress:
    - to:
        - podSelector: { matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }} } }
    - to:
        - namespaceSelector: {}
          podSelector: { matchLabels: { k8s-app: kube-dns } }
      ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
    {{- range .Values.networkPolicy.allowEgressCIDRs }}
    - to: [{ ipBlock: { cidr: {{ . }} } }]
    {{- end }}
{{- end }}
