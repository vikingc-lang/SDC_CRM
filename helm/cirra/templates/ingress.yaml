{{- if .Values.ingress.enabled }}
{{- $fn := include "cirra.fullname" . }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fn }}
  labels: {{- include "cirra.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls: {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - { path: /api, pathType: Prefix, backend: { service: { name: {{ $fn }}-api, port: { number: 8000 } } } }
          - { path: /health, pathType: Exact, backend: { service: { name: {{ $fn }}-api, port: { number: 8000 } } } }
          - { path: /, pathType: Prefix, backend: { service: { name: {{ $fn }}-web, port: { number: 3000 } } } }
{{- end }}
